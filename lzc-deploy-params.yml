params:
  # 免密登录用：用户名固定，密码安装时随机生成，登录页由 inject 自动填充，
  # 用户不需要手打账号密码（对应审核驳回「没有 oidc 和密码注入」）。
  - id: login_user
    type: string
    name: "管理员用户名"
    description: "Alf.io 后台管理员用户名"
    default_value: "admin"

  - id: login_password
    type: secret
    name: "管理员密码"
    description: "Alf.io 后台管理员密码。安装时自动随机生成，登录页会自动填充；也可在此自定义。"
    default_value: "$random(len=20)"
